name: CSB Security Change Gate

on:
  workflow_call:
    inputs:
      policy_path:
        description: Repository-relative path to the CSB guardrail policy
        required: false
        type: string
        default: .csb/guardrails.json
      csb_ref:
        description: Immutable CSB release ref
        required: false
        type: string
        default: v1
      default_branch:
        description: Default branch used by the gate policy
        required: false
        type: string
        default: main
    secrets:
      OPENAI_API_KEY:
        description: Scanner credential
        required: false

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  security-change-gate:
    name: CSB Security Change Gate
    runs-on: ubuntu-latest
    env:
      CSB_GUARDRAIL_CONTRACT: legacy-contained
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout CSB release
        uses: actions/checkout@v6
        with:
          repository: OkamiOps/okami-sentinel
          ref: ${{ inputs.csb_ref }}
          path: .csb-tool
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install gate CLI dependency closure
        run: pnpm --dir .csb-tool install --frozen-lockfile --filter @csb/gate-cli...

      - name: Resolve event revisions
        id: revisions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "base_sha=${BASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Check scanner authentication
        id: scanner-auth
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "${OPENAI_API_KEY}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run security change gate
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POLICY_PATH: ${{ inputs.policy_path }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
        run: |
          set +e
          pnpm --dir .csb-tool --filter @csb/gate-cli start -- \
            --repository "${GITHUB_WORKSPACE}" \
            --base-ref "${BASE_SHA}" \
            --head-ref "${HEAD_SHA}" \
            --policy "${POLICY_PATH}" \
            --output "${GITHUB_WORKSPACE}/csb-gate-result.json" \
            --repository-key "github.com/${GITHUB_REPOSITORY}" \
            --repository-name "${GITHUB_REPOSITORY#*/}" \
            --default-branch "${DEFAULT_BRANCH}" \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --gate-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gate_exit=$?
          set -e
          echo "exit_code=${gate_exit}" >> "${GITHUB_OUTPUT}"

      - name: Upload gate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csb-gate-artifact
          path: csb-gate-result.json
          if-no-files-found: warn

      - name: Write gate summary
        if: always()
        env:
          HAS_SCANNER_CREDENTIAL: ${{ steps.scanner-auth.outputs.ready }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          let body = '## CSB Security Change Gate\n\n';
          if (!fs.existsSync('csb-gate-result.json')) {
            body += 'The gate artifact was not produced. Inspect the setup and CLI steps.\n';
          } else {
            const artifact = JSON.parse(fs.readFileSync('csb-gate-result.json', 'utf8'));
            const credentialReady = process.env.HAS_SCANNER_CREDENTIAL === 'true';
            const conclusion = artifact.decision.githubConclusion;
            body += `- Outcome: \`${artifact.decision.outcome}\`\n`;
            body += `- Conclusion: \`${conclusion}\`\n`;
            body += `- Findings: ${artifact.findings.length}\n`;
            body += `- Estimated cost: $${artifact.scan.cost?.estimatedUsd ?? 0}\n`;
            if (!credentialReady) body += '- Check publication: unavailable because scanner authentication is missing\n';
          }
          fs.appendFileSync(summaryPath, body);
          NODE

      - name: Enforce gate result
        if: always()
        run: |
          echo "Legacy Guardrails workflow is contained and cannot approve a branch. Upgrade to contract v2." >> "${GITHUB_STEP_SUMMARY}"
          exit 3
