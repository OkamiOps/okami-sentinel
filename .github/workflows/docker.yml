name: Docker image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build Linux image and smoke server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Docker setup script
        run: node --test scripts/docker/setup.test.mjs

      - name: Build image
        run: >-
          docker build
          --build-arg CSB_GITHUB_ACTIONS_WORKFLOW_SHA=${{ github.sha }}
          --tag csb-sentinel:${{ github.sha }}
          .

      - name: Smoke server without engines or providers
        run: node scripts/docker/smoke.mjs csb-sentinel:${{ github.sha }}

      - name: Exercise bundled HTTP engines
        env:
          # Bind mounts retain the host UID, which can differ from app UID 1000.
          CSB_DOCKER_QA_FIXTURE_UID: "1001"
        run: node scripts/docker/workflow-smoke.mjs csb-sentinel:${{ github.sha }}
