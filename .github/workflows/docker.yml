name: Docker image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build Linux image and smoke server
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted"]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Docker setup script
        run: node --test scripts/docker/setup.test.mjs

      - name: Verify image retention script
        run: bash scripts/docker/ci-retention.test.sh

      - name: Build image
        run: >-
          docker build
          --build-arg CSB_GITHUB_ACTIONS_WORKFLOW_SHA=${{ github.sha }}
          --tag csb-sentinel:${{ github.sha }}
          .

      - name: Verify bundled OpenGrep version
        run: docker run --rm --user 1000:1000 csb-sentinel:${{ github.sha }} opengrep --version | grep -Fx '2.0.0'

      - name: Smoke server without engines or providers
        run: node scripts/docker/smoke.mjs csb-sentinel:${{ github.sha }}

      - name: Exercise bundled HTTP engines
        env:
          # Bind mounts retain the host UID, which can differ from app UID 1000.
          CSB_DOCKER_QA_FIXTURE_UID: "1001"
        run: node scripts/docker/workflow-smoke.mjs csb-sentinel:${{ github.sha }}

      # Five self-hosted runners share one Docker daemon. A successful push to
      # main keeps this image and the previous main-* image. Every other run
      # deletes only the plain sha tag built by this job.
      - name: Remove CI image
        if: always()
        env:
          IMAGE_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          JOB_STATUS: ${{ job.status }}
        run: bash scripts/docker/ci-retention.sh
