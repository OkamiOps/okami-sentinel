name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.17.0

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository hygiene
        run: pnpm check:repository

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install browser for UI regression tests
        run: pnpm --filter @csb/web exec playwright install --with-deps chromium

      - name: Allocate browser regression port
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { createServer } from "node:net";
          import { once } from "node:events";

          const envFile = process.env.GITHUB_ENV;
          if (!envFile) throw new Error("GITHUB_ENV is required to publish CSB_WEB_E2E_PORT");
          const server = createServer();
          server.once("error", (error) => { throw error; });
          server.listen(0, "127.0.0.1");
          await once(server, "listening");
          const address = server.address();
          server.close();
          await once(server, "close");
          if (address === null || typeof address === "string") {
            throw new Error("Unable to allocate a browser regression port");
          }
          appendFileSync(envFile, `CSB_WEB_E2E_PORT=${address.port}\n`);
          console.log(`CSB_WEB_E2E_PORT=${address.port}`);
          NODE

      - name: Browser regression tests
        run: pnpm --filter @csb/web test:e2e

      - name: Real API and SQLite browser test
        run: pnpm test:e2e:real-api

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          path: |
            output/playwright-improvements/test-results/
            output/playwright/real-api/
          if-no-files-found: ignore
          retention-days: 7
